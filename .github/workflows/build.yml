name: Build APK on Stable Ubuntu

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # هذا هو السطر السحري: استخدام نسخة 22.04 المستقرة بدلاً من الأحدث
    runs-on: ubuntu-22.04 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Prepare files
      run: |
        if [ -f "buildozer.spec." ]; then mv "buildozer.spec." "buildozer.spec"; fi
        if [ -f "Aperson.py" ] && [ ! -f "main.py" ]; then cp Aperson.py main.py; fi

    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install buildozer cython "sh>=1.10,<2.0"

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apreson-apk
        path: bin/*.apk
