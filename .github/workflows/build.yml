name: Build Kivy Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix spec filename if needed
      run: |
        if [ -f "buildozer.spec." ]; then mv "buildozer.spec." "buildozer.spec"; fi

    - name: Prepare entry file
      run: |
        if [ -f "Aperson.py" ] && [ ! -f "main.py" ]; then
          cp Aperson.py main.py
        fi

    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android debug
        buildozer_version: stable

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: ${{ steps.buildozer.outputs.filename }}
