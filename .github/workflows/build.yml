name: Build Kivy APK with Cache

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # --- التخزين المؤقت (Caching) ---
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-v4-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-v4-

    - name: Cache Buildozer local directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-v4-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-local-v4-
    # ---------------------------------

    - name: Fix spec filename and prepare entry
      run: |
        if [ -f "buildozer.spec." ]; then mv "buildozer.spec." "buildozer.spec"; fi
        if [ -f "Aperson.py" ] && [ ! -f "main.py" ]; then cp Aperson.py main.py; fi

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer and stable p4a
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install buildozer cython
        # تثبيت إصدار مستقر من p4a بدلاً من master
        python3 -m pip install git+https://github.com/kivy/python-for-android.git@release-2024.01.21

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apreson-apk
        path: bin/*.apk
