name: Build Kivy APK Manual

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix spec filename and prepare entry
      run: |
        if [ -f "buildozer.spec." ]; then mv "buildozer.spec." "buildozer.spec"; fi
        if [ -f "Aperson.py" ] && [ ! -f "main.py" ]; then cp Aperson.py main.py; fi

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer and latest p4a/kivy
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install buildozer cython
        # تثبيت أحدث نسخة من python-for-android و kivy لحل مشكلة NDK
        python3 -m pip install git+https://github.com/kivy/python-for-android.git
        python3 -m pip install git+https://github.com/kivy/kivy.git

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apreson-apk
        path: bin/*.apk
