name: 🤖 Doctor Bot (AutoFix)

on:
  workflow_dispatch: # يمكنك تشغيله يدوياً في أي وقت

permissions:
  contents: write # صلاحية تعديل الملفات ورفعها

jobs:
  fix-files:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Doctor Script
      run: |
        # 1. إصلاح اسم buildozer.spec إذا كان به نقطة زائدة
        if [ -f "buildozer.spec." ]; then mv "buildozer.spec." "buildozer.spec"; fi

        # 2. إنشاء ملف buildozer.spec المستقر
        cat > buildozer.spec << 'EOF'
        [app]
        title = APRESON ULTIMATE
        package.name = apreson
        package.domain = org.apreson
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json,ttf
        version = 1.0

        requirements = python3,kivy

        android.accept_sdk_license = True
        orientation = landscape
        fullscreen = 0

        android.permissions = INTERNET
        android.api = 31
        android.minapi = 24
        android.archs = arm64-v8a, armeabi-v7a

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

        # 3. إنشاء ملف build.yml المستقر
        cat > .github/workflows/build.yml << 'EOF'
        name: Build Kivy APK
        on:
          workflow_dispatch:
          push:
            branches: [ main ]
        jobs:
          build:
            runs-on: ubuntu-22.04
            steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'
            - name: Fix files
              run: |
                if [ -f "Aperson.py" ] && [ ! -f "main.py" ]; then cp Aperson.py main.py; fi
            - name: Install deps
              run: |
                sudo apt-get update
                sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
                python3 -m pip install --upgrade pip setuptools wheel
                python3 -m pip install buildozer==1.6.0 cython "sh>=1.10,<2.0"
            - name: Build
              run: buildozer android debug
            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                name: apreson-apk
                path: bin/*.apk
        EOF

    - name: Commit and Push Fixes
      run: |
        git config --global user.name "Doctor Bot"
        git config --global user.email "bot@apreson-game.com"
        git add buildozer.spec .github/workflows/build.yml
        git commit -m "🤖 Doctor Bot: إصلاح الملفات تلقائياً" || echo "لا توجد تغييرات تحتاج للحفظ"
        git push
